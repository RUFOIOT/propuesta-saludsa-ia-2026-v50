spring:
  application:
    name: sales-copilot
  datasource:
    url: ${DB_URL:jdbc:h2:mem:salescopilot;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: ${SERVER_PORT:8080}

hubspot:
  api-key: ${HUBSPOT_API_KEY:}

google:
  sheets:
    spreadsheet-id: ${GOOGLE_SHEETS_SPREADSHEET_ID:}

logging:
  level:
    com.saludsa.salescopilot: INFO
